<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All Dev Logs - Creator CStudios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars" id="stars"></div>
    <nav>
        <button class="nav-hamburger" id="nav-hamburger" aria-label="Menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-menu" id="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#games-section">Games</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="blogs.html">Dev Logs</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <div id="blogs-page">
        <a href="blogs.html" style="color:rgba(255,255,255,0.45);font-size:14px;text-decoration:none;display:inline-block;margin-bottom:20px;">&larr; Back to Latest</a>
        <h1 class="studio-title">All Dev Logs</h1>
        <p class="blogs-subtitle">Full archive — most recent first.</p>
        <div id="archive-list"></div>
    </div>

    <script src="stars.js"></script>
    <script src="nav.js"></script>
    <script src="blogs-data.js"></script>
    <script>
        const list = document.getElementById('archive-list');
        if (!BLOG_POSTS.length) {
            list.innerHTML = '<p class="blogs-empty">No posts yet.</p>';
        } else {
            list.innerHTML = BLOG_POSTS.map((p, i) => `
                <a class="blog-card" href="blogs.html#${p.id}" onclick="sessionStorage.setItem('blogs_open','${p.id}')">
                    <div class="blog-card-thumb" style="background-image:url('${p.thumb}')"></div>
                    <div class="blog-card-body">
                        <div class="blog-card-meta">
                            <span class="blog-card-game">${p.game}</span>
                            <span class="blog-card-date">${p.date}</span>
                            ${i === 0 ? '<span class="blog-card-latest">Latest</span>' : ''}
                        </div>
                        <div class="blog-card-title">${p.title}</div>
                        <div class="blog-card-excerpt">${p.excerpt}</div>
                        <span class="blog-card-cta">Read &rarr;</span>
                    </div>
                </a>
            `).join('');
        }
    </script>
    <footer id="site-footer">
        <div id="footer-inner">
            <div id="footer-brand">
                <img src="images/CCStudios.webp" alt="Creator CStudios" id="footer-logo-img">
                <div id="footer-copy">Copyright &copy; 2026 Creator CStudios.<br>All rights reserved.</div>
            </div>
            <div class="footer-col">
                <div class="footer-col-title">Site</div>
                <a class="footer-link" href="index.html">Home</a>
                <a class="footer-link" href="index.html#games-section">Games</a>
                <a class="footer-link" href="about.html">About</a>
                <a class="footer-link" href="blogs.html">Dev Logs</a>
                <a class="footer-link" href="contact.html">Contact</a>
            </div>
            <div class="footer-col">
                <div class="footer-col-title">Connect</div>
                <a class="footer-link" href="https://discord.gg/pfwVptewm9" target="_blank" rel="noopener">Discord</a>
                <a class="footer-link" href="https://www.youtube.com/@CreatorCStudios" target="_blank" rel="noopener">YouTube</a>
                <a class="footer-link" href="https://x.com/CreatorCStudio" target="_blank" rel="noopener">X (Twitter)</a>
                <a class="footer-link" href="https://www.roblox.com/communities/3215945/Creators-CStudios#!/about" target="_blank" rel="noopener">Roblox</a>
            </div>
        </div>
    </footer>
</body>
</html>
